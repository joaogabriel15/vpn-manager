[package]
name = "vpn-manager-native"
version = "0.2.0"
edition = "2024"

[features]
gui = ["dep:eframe"]

[dependencies]
vpn-manager-core = { path = "../vpn-manager-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
