name: Package repositories
on:
  # Release-created events from GITHUB_TOKEN do not trigger workflows; workflow_run does.
  workflow_run:
    workflows: [Desktop releases]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-repositories
  cancel-in-progress: false
jobs:
  build:
    # Only stable releases (version tags) feed the repositories.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir incoming
          gh release download --repo "$GITHUB_REPOSITORY" --dir incoming --pattern '*.deb' --pattern '*.deb.sha256' --pattern '*.rpm' --pattern '*.rpm.sha256'
          cd incoming && sha256sum -c ./*.sha256
      - name: Build signed APT and DNF repositories
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm
          rm incoming/*.sha256
          bash scripts/build-package-repos.sh incoming site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  install:
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:trixie', 'fedora:41', 'archlinux:latest']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    steps:
      - name: Install from the published repository, as documented
        run: |
          base=https://joaogabriel15.github.io/vpn-manager
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y curl gpg ca-certificates
            curl -fsSL $base/vpn-manager.asc | gpg --dearmor -o /usr/share/keyrings/vpn-manager.gpg
            echo "deb [signed-by=/usr/share/keyrings/vpn-manager.gpg] $base/apt stable main" > /etc/apt/sources.list.d/vpn-manager.list
            apt-get update && apt-get install -y vpn-manager
          elif command -v dnf >/dev/null; then
            curl -fsSL -o /etc/yum.repos.d/vpn-manager.repo $base/vpn-manager.repo
            dnf install -y vpn-manager
          else
            pacman-key --init
            curl -fsSL $base/vpn-manager.asc | pacman-key --add -
            pacman-key --lsign-key D3EF5AFE4AFEB7F8DAF3D5DCC0F57413B694E98A
            printf '\n[vpn-manager]\nServer = %s/arch/$arch\n' "$base" >> /etc/pacman.conf
            pacman -Sy --noconfirm vpn-manager-bin
          fi
          vpn-manager-cli --version
          test -f /usr/share/applications/br.com.pacheco.VpnManager.desktop
  homebrew:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update the cask in joaogabriel15/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          version=${tag#v}
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir sums --pattern '*macos-*.dmg.sha256'
          arm=$(cut -d' ' -f1 sums/*macos-arm64.dmg.sha256)
          intel=$(cut -d' ' -f1 sums/*macos-x86_64.dmg.sha256)
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          git clone -q git@github.com:joaogabriel15/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed "s/@VERSION@/$version/; s/@SHA256_ARM@/$arm/; s/@SHA256_INTEL@/$intel/" packaging/homebrew/vpn-manager.rb.in > tap/Casks/vpn-manager.rb
          cd tap
          git config user.name "VPN Manager releases"
          git config user.email "41350439+joaogabriel15@users.noreply.github.com"
          git add Casks/vpn-manager.rb
          git diff --cached --quiet || { git commit -qm "vpn-manager $version"; git push -q; }
  brew-install:
    needs: homebrew
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Install from the tap, as documented
        run: |
          brew install --cask joaogabriel15/tap/vpn-manager
          vpn-manager-cli --version
          test -d "/Applications/VPN Manager.app"
          brew uninstall --cask vpn-manager
          test ! -e "/Applications/VPN Manager.app"

