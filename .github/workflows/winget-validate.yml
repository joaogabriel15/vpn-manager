name: winget manifest check
on:
  workflow_dispatch:
  push:
    paths: ['packaging/winget/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Windows Server images do not ship winget.
      - uses: Cyberboss/install-winget@v1
      - name: Validate and install from the manifests
        shell: pwsh
        run: |
          $dir = (Get-ChildItem packaging/winget -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1).FullName
          winget validate --manifest $dir
          if ($LASTEXITCODE -ne 0) { throw 'winget validate failed' }
          winget settings --enable LocalManifestFiles
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install failed: $LASTEXITCODE" }
          & "$env:ProgramFiles\VPN Manager\vpn-manager-cli.exe" --version
          winget uninstall --product-code '{61A9EC16-D1FC-42C0-A8C6-C5B1170E39E7}' --disable-interactivity
