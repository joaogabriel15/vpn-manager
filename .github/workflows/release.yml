name: Desktop releases
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        shell: python
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + version:
              raise SystemExit('Tag must match Cargo.toml: v' + version)
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev python3-gi dbus-daemon dbus-x11 xvfb network-manager-openvpn rpm
      - run: cargo fmt --all -- --check
      - run: python tests/release-packaging.py
      - name: Linux checks and build
        if: runner.os == 'Linux'
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked --target ${{ matrix.target }} -p vpn-manager -p vpn-manager-networkmanager
      - name: Saved password GUI flow (isolated)
        if: runner.os == 'Linux'
        # setup-python's interpreter has no PyGObject; the D-Bus fixtures need the system one.
        run: PATH=/usr/bin:$PATH dbus-run-session -- xvfb-run -a python3 tests/saved-login.py --binary target/${{ matrix.target }}/release/vpn-manager
      - name: Windows and macOS checks and build
        if: runner.os != 'Linux'
        run: |
          cargo test -p vpn-manager-core -p vpn-manager-native --all-features --locked
          cargo clippy -p vpn-manager -p vpn-manager-native --all-features --all-targets --locked -- -D warnings
      - name: Windows and macOS build
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p vpn-manager -p vpn-manager-native
      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & target/${{ matrix.target }}/release/vpn-manager-native-cli.exe --version
          & target/${{ matrix.target }}/release/vpn-manager-native-cli.exe --help
      - name: Windows profile discovery (no activation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-native.ps1 -Cli ./target/${{ matrix.target }}/release/vpn-manager-native-cli.exe
      - name: CLI smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          target/${{ matrix.target }}/release/vpn-manager-native-cli --version
          target/${{ matrix.target }}/release/vpn-manager-native-cli --help
          target/${{ matrix.target }}/release/vpn-manager-native-cli list
      - name: Package
        run: python scripts/package-release.py --installers --target ${{ matrix.target }} --binary-dir target/${{ matrix.target }}/release
      - name: Installer install/remove smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/vpn-manager-cli --version
          test -f /usr/share/applications/br.com.pacheco.VpnManager.desktop
          sudo apt-get remove -y vpn-manager
          test ! -e /usr/bin/vpn-manager
          rpm -qp --requires dist/*.rpm | grep -q NetworkManager
      - name: Installer install/remove smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 40; throw "MSI install failed: $($p.ExitCode)" }
          & "$env:ProgramFiles\VPN Manager\vpn-manager-cli.exe" --version
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\VPN Manager.lnk")) { throw 'Start menu shortcut missing' }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\VPN Manager\vpn-manager.exe") { throw 'Files left after uninstall' }
      - name: Installer mount smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          mount=$(mktemp -d)
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$mount"
          codesign --verify --deep --strict "$mount/VPN Manager.app"
          "$mount/VPN Manager.app/Contents/MacOS/vpn-manager-cli" --version
          test -L "$mount/Applications"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete set and checksums
        run: python scripts/verify-release.py dist
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_number }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            release_tag="$RELEASE_REF_NAME"
            tag_options=(--verify-tag --latest)
          else
            release_tag="main-${RELEASE_RUN}-${RELEASE_ATTEMPT}-${RELEASE_COMMIT:0:7}"
            tag_options=(--target "$RELEASE_COMMIT" --prerelease)
          fi
          gh release create "$release_tag" dist/* "${tag_options[@]}" --draft --title "VPN Manager $release_tag" --notes-file docs/RELEASE-NOTES.md
          gh release edit "$release_tag" --draft=false
